<text x="343.33333333333337" y="1115" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">por nome de arquivo ou</text>
<text x="343.33333333333337" y="1130" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">coluna de ID (patient_id,</text>
<text x="343.33333333333337" y="1145" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">echo, filename...)</text>
<rect x="556.6666666666667" y="1065" width="386.6666666666667" height="110" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
<text x="750.0000000000001" y="1093" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Média ponderada</text>
<text x="750.0000000000001" y="1115" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">peso ∝ (AUC − ECE)</text>
<text x="750.0000000000001" y="1130" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">de cada modalidade,</text>
<text x="750.0000000000001" y="1145" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">via CV interna</text>
<rect x="963.3333333333335" y="1065" width="386.6666666666667" height="110" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
<text x="1156.6666666666667" y="1093" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Stacking</text>
<text x="1156.6666666666667" y="1115" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">meta-modelo combina</text>
<text x="1156.6666666666667" y="1130" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">probabilidades de</text>
<text x="1156.6666666666667" y="1145" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">todas as modalidades</text>
