<text x="750.0" y="905" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">Regressão Logística · KNN · SVM · Random Forest · Gradient Boosting · MLP</text>
<text x="750.0" y="931" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Split 80/20 → CV interna 5-fold×3 (seleção) → held-out (avaliação final, nunca vaza)</text>
<text x="750.0" y="953" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Score clínico (AUC + MCC − ECE) com veto de piso de sensibilidade + SHAP</text>
<text x="750.0" y="973" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Persistência do vencedor · Interpretabilidade · Teste A/B (McNemar)</text>
